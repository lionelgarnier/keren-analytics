name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run every Monday at 06:00 UTC so that newly-disclosed vulnerabilities
    # in transitive dependencies turn the badge red even when nothing was
    # pushed for a while.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: scripts/security-audit.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run audit:security -- --ci

      - name: Run test suite
        run: npm test
