name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run every Monday at 06:00 UTC so that newly-disclosed vulnerabilities
    # in transitive dependencies turn the badge red even when nothing was
    # pushed for a while.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: scripts/security-audit.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repo secret scan
        run: npm run audit:security -- --ci

      # Fail the build on a newly-disclosed high/critical advisory in a
      # dependency (the manual `overrides` pins would otherwise rot silently).
      - name: npm audit (high+)
        run: npm audit --audit-level=high
