name: Deploy to Azure

# Builds the Docker image, pushes it to the project's Azure Container Registry,
# and rolls a new Container App revision. Image-only path — the Bicep template
# at infra/main.bicep is NOT re-run here (avoids needing to ship SESSION_SECRET
# as a GitHub Secret). For infra changes, use `./deploy/azure-deploy.sh` or a
# manual `az deployment group create` against infra/main.bicep.
#
# Auth is OIDC-only (no long-lived secret). Bootstrap one-time with
# `./deploy/azure-ci-setup.sh`, then add the printed AZURE_* values as
# repository secrets.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "kql/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  AZURE_RG: keren-analytics-prod
  CONTAINER_APP: ca-keren-analytics
  ACR_NAME: kerenanalyticsdfrvtmlbgqqbk
  IMAGE_NAME: keren-analytics

jobs:
  test:
    name: Tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Build, push & deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$AZURE_RG" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.value }}"

      - name: Wait for new revision to be ready
        run: |
          for i in $(seq 1 24); do
            ready=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RG" --query "properties.latestReadyRevisionName" -o tsv)
            latest=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RG" --query "properties.latestRevisionName" -o tsv)
            echo "Latest: $latest | Ready: $ready"
            if [[ "$ready" == "$latest" ]]; then
              echo "Revision is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Revision did not become ready within 4 minutes." >&2
          az containerapp logs show -n "$CONTAINER_APP" -g "$AZURE_RG" --tail 50 --format text || true
          exit 1

      # If the new revision never became ready, reactivate the previous
      # revision so production keeps serving the last-good image instead of a
      # half-broken deploy. Best-effort — logs and fails the job regardless.
      - name: Roll back to previous revision on failure
        if: failure()
        run: |
          prev=$(az containerapp revision list -n "$CONTAINER_APP" -g "$AZURE_RG" \
            --query "sort_by([?properties.active], &properties.createdTime)[-2].name" -o tsv || true)
          if [[ -n "$prev" ]]; then
            echo "Reactivating previous revision: $prev"
            az containerapp revision activate -n "$CONTAINER_APP" -g "$AZURE_RG" --revision "$prev" || true
          else
            echo "No previous revision found to roll back to." >&2
          fi

      - name: Deployment summary
        if: success()
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          {
            echo "### Azure Container Apps deploy"
            echo
            echo "- Image: \`${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ steps.tag.outputs.value }}\`"
            echo "- FQDN: \`${FQDN}\`"
            echo "- Custom domain: https://keren.run"
          } >> "$GITHUB_STEP_SUMMARY"
