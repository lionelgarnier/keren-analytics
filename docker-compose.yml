# Keren Analytics - Docker Compose
#
# Quick start (demo mode):
#   docker compose up
#   Open http://localhost:3000
#
# Real Azure mode:
#   1. Copy .env.example to .env and fill in your Azure credentials
#   2. Set NODE_ENV=production and a real SESSION_SECRET in .env
#   3. docker compose up --build
#
# Build and run:
#   docker compose up --build

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - "./data:/app/data"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AZURE_MODE=${AZURE_MODE:-mock}
      - SESSION_SECRET=${SESSION_SECRET:-dev-compose-secret-local-only}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-organizations}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT:-}
      - AZURE_FOUNDRY_DEPLOYMENT=${AZURE_FOUNDRY_DEPLOYMENT:-}
      - AZURE_FOUNDRY_CLIENT_ID=${AZURE_FOUNDRY_CLIENT_ID:-}
      - BACKUP_BLOB_ACCOUNT=${BACKUP_BLOB_ACCOUNT:-}
      - BACKUP_BLOB_CONTAINER=${BACKUP_BLOB_CONTAINER:-sqlite-backups}
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-3600000}
      - BACKUP_MAX_SNAPSHOTS=${BACKUP_MAX_SNAPSHOTS:-24}
      - MOCK_RESOURCES=${MOCK_RESOURCES:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
