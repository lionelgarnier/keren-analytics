# Keren Analytics - Docker Compose
#
# Quick start (demo mode):
#   docker compose up
#   Open http://localhost:3000
#
# Real Azure mode:
#   1. Copy .env.example to .env and fill in your Azure credentials
#   2. docker compose up
#
# Build and run:
#   docker compose up --build

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - AZURE_MODE=${AZURE_MODE:-mock}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-organizations}
      - MOCK_RESOURCES=${MOCK_RESOURCES:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/auth/session"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
