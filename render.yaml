# Render.com Blueprint — deploy with one click
# https://render.com/docs/blueprint-spec
#
# Click "New" > "Blueprint" in Render dashboard, point to this repo,
# and Render will create the service automatically.

services:
  - type: web
    name: keren-analytics
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AZURE_MODE
        value: mock
      # This blueprint is a deliberate one-click PUBLIC MOCK DEMO: it serves
      # the deterministic sample dataset, with no Azure account and no real
      # tenant data. Mock mode disables authentication, so src/config.js
      # refuses to boot on NODE_ENV=production unless that intent is stated
      # explicitly — this flag is that statement. Remove it (and set
      # AZURE_MODE=real below) for an instance serving real telemetry.
      - key: ALLOW_MOCK_IN_PROD
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      # --- Uncomment for real Azure mode (and delete ALLOW_MOCK_IN_PROD) ---
      # - key: AZURE_MODE
      #   value: real
      # - key: AZURE_CLIENT_ID
      #   sync: false
      # - key: AZURE_CLIENT_SECRET
      #   sync: false
      # - key: AZURE_REDIRECT_URI
      #   value: https://keren-analytics-XXXX.onrender.com/auth/callback
      # - key: AZURE_TENANT_ID
      #   value: organizations
